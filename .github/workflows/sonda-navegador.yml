name: sonda-com-navegador
# Manual. Mede se um navegador real (sem disfarce) abre os sites que recusam o robô simples.
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: echo "sonda arquivada; ver docs/SONDA.md"
      - uses: actions/upload-artifact@v4
        with:
          name: sonda-navegador
          path: sonda_navegador.json

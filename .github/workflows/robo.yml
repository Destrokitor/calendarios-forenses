name: robo-e-vigia

# Meia-noite no Brasil seria 03:00 UTC. O robô principal roda no Mac do dono (IP brasileiro
# residencial, que os sites aceitam). Este job é (1) o vigia, que avisa por e-mail se os
# dados pararam de ser atualizados, e (2) a reserva, que roda na nuvem os motores cujas
# fontes não bloqueiam o GitHub (roda_na_nuvem = True).
on:
  schedule:
    - cron: "0 4 * * *"   # 01:00 em Brasília (04:00 UTC), depois do robô do Mac
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  nuvem-e-vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar leitor de PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Testes
        run: python -W error -m unittest discover -s tests
      - name: Rodar os motores que funcionam na nuvem
        run: python -m robo.executar --nuvem
        continue-on-error: true   # a falha de um motor não impede o vigia de avisar
      - name: Gravar dados novos
        run: |
          git config user.name "calendarios-forenses-robo"
          git config user.email "robo@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "sem mudanças"
          else
            git commit -m "dados: atualização automática (nuvem) $(date -u +%F)"
            git pull --rebase
            git push
          fi
      - name: Manter o agendamento vivo
        # O GitHub desativa agendamentos de repositório sem atividade por 60 dias.
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/robo.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
      - name: Vigia (falha = e-mail do GitHub)
        run: python -m robo.vigia
